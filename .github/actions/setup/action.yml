name: Set up chefe
description: >-
  Install uv and chefe, restore the solved environment from cache, and install it, so a
  workflow only has to name the tasks it wants to run.

inputs:
  mode:
    description: >-
      How the environment is built. `chefe` compiles the manifest and installs the solved
      environment, which is what a repository declaring `[tool.chefe]` wants. `uv` runs a plain
      locked `uv sync`, which is what the library packages do while they still declare their
      development dependencies to uv directly. Both share the caching and the tool versions,
      which is the point, since those are what drift when each repository writes its own.
    required: false
    default: chefe
  extras:
    description: >-
      Space separated extras for `uv` mode, passed as repeated `--extra` flags. Ignored in
      `chefe` mode, where the manifest already says what an environment contains.
    required: false
    default: dev
  python-version:
    description: The interpreter uv provisions. Match the project's requires-python.
    required: false
    default: "3.14"
  chefe-version:
    description: >-
      A pip specifier for chefe itself. Pin it exactly when a workflow must be reproducible
      across a chefe release, and leave the floor when riding the latest is what you want.
    required: false
    default: ">=0.0.27"
  cache-key-files:
    description: >-
      The files whose contents decide whether the cached environment is still valid. The
      default covers a package that declares its dependencies in pyproject.toml. A repository
      whose manifest is chefe.toml should pass that instead. Use a brace glob such as
      `{chefe.toml,pyproject.toml}` when both files shape the environment.
    required: false
    default: pyproject.toml
  cache-paths:
    description: >-
      Additional project-local build directories to cache. Pass a newline-separated list for
      native targets or other expensive outputs that are safe to restore with the environment.
    required: false
    default: ""
  resolve:
    description: >-
      Whether to solve when the lock does not match the manifest. Leave this false so a drifted
      lock fails the build rather than being silently solved around, which is the whole point of
      committing one. Set it true only where the lock is deliberately not committed.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: ${{ inputs.python-version }}

    # chefe installs pixi, the solver it compiles to, on first use, so this is the whole
    # bootstrap. The tool goes to ~/.local/bin, which is not on PATH for later steps until
    # it is named in GITHUB_PATH.
    - name: install chefe
      if: inputs.mode == 'chefe'
      shell: bash
      run: |
        uv tool install "chefe${{ inputs.chefe-version }}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # Three paths, because a cold run pays for all three. `~/.pixi` is the solver binary,
    # `~/.cache/rattler` is the downloaded package store shared across environments, and
    # `.chefe/.pixi` is this project's built environment. The key covers the manifest alone,
    # so a dependency change correctly misses and rebuilds.
    - name: cache the solver and the solved environment
      if: inputs.mode == 'chefe'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.pixi
          ~/.cache/rattler
          .chefe/.pixi
          ${{ inputs.cache-paths }}
        key: chefe-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ hashFiles(inputs.cache-key-files) }}
        restore-keys: |
          chefe-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-
          chefe-${{ runner.os }}-${{ runner.arch }}-

    - name: install the environment
      if: inputs.mode == 'chefe'
      shell: bash
      run: chefe install ${{ inputs.resolve == 'true' && '--resolve' || '' }}

    # `uv sync` is already locked and already caches through setup-uv, so this needs nothing
    # beside it. `--frozen` is the default and matches `resolve: false`, since a lock that no
    # longer matches its manifest should fail here rather than be quietly re-solved. A repository
    # whose lock is deliberately not committed sets `resolve: true` to solve fresh instead.
    - name: sync the environment
      if: inputs.mode == 'uv'
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        RESOLVE: ${{ inputs.resolve }}
      run: |
        flags=()
        for extra in $EXTRAS; do flags+=(--extra "$extra"); done
        [ "$RESOLVE" = "true" ] || flags+=(--frozen)
        uv sync "${flags[@]}"
