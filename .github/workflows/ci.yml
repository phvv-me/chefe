name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing
  workflow_dispatch: # manual runs (e.g. to validate main directly between releases)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # A published package stands on its own, so the bootstrap is the official uv action and
      # nothing of ours. chefe provisions environments for a living and still cannot use itself
      # to build itself, which is why this repository once hosted a shared action for the others
      # to reuse. That coupling made every sibling release depend on this default branch, so each
      # repository now names its own two lines here instead.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # One sync names every extra the gate needs, and the `uv run` steps below reuse that
      # environment without pruning it.
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pyrefly check
      - run: uv run pytest -q
