name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # local path, not the remote phvv-me/chefe/...@main tag, since this repository hosts the
      # action, so its own CI proves the action before the other repositories consume it
      - uses: ./.github/actions/setup
        with:
          mode: uv
          python-version: ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pyrefly check
      - run: uv run pytest -q
