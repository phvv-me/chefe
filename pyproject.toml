[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chefe"
version = "0.0.28"
description = "One manifest for every package manager | conda, Python, Node.js, Rust & more, behind a single file."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "package-manager",
  "pixi",
  "conda",
  "python",
  "cargo",
  "npm",
  "monorepo",
  "polyglot",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "cyclopts>=4",
  "filelock>=3.20,<4",
  "pydantic>=2.13",
  "tomlkit>=0.13",
  "packaging>=24",
  "plumbum>=2",
  "rich>=13",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyrefly>=1",
  "mypy>=1.11",
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "syrupy>=4",
  "pytest-subprocess>=1.5",
  "pytest-mock>=3.14",
  "faker>=30",
  "dirty-equals>=0.8",
]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]

[project.scripts]
chefe = "chefe.cli:app"

[project.urls]
Homepage = "https://phvv.me/chefe"
Documentation = "https://phvv.me/chefe"
Repository = "https://github.com/phvv-me/chefe"
Issues = "https://github.com/phvv-me/chefe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chefe"]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "src"
namespace_packages = false

[tool.pydantic-mypy]
# Type the synthesized `__init__` from declared fields so plain models don't fall back to `Any`.
init_typed = true

# `extra="allow"` models (FlexModel and its subclasses) accept arbitrary unknown keys we forward
# verbatim to pixi/uv, so the pydantic plugin must synthesize `__init__(self, **data: Any)` for
# them. That `Any` is plugin-generated, not in our source, and is irreducible because the extras
# are untyped by design. We scope the `explicit-any` waiver to exactly the modules that define
# such models, keeping the global ban in force everywhere else.
[[tool.mypy.overrides]]
module = [
  "chefe.core.base.flexible",
  "chefe.manifest.schema",
  "chefe.manifest.schema.*",
  "chefe.compiled.npm",
]
disable_error_code = ["explicit-any"]

[tool.pyrefly]
project-includes = ["src/**/*.py"]
# No interpreter path here. It used to point into the monorepo's pixi env, which does not
# exist in CI, so pyrefly silently fell back to its bundled 3.13 and rejected every t-string
# and unparenthesized multi-exception except as invalid syntax. Pinning the version lets
# pyrefly use whichever 3.14 interpreter the caller already activated.
python-version = "3.14"

[tool.pytest.ini_options]
addopts = "-q -ra --import-mode=importlib --cov=chefe --cov-report=term-missing"
testpaths = ["tests"]
strict = true

[tool.coverage.run]
source = ["chefe"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "inline-snapshot>=0.34.1",
]

[tool.mcmr.execution]
contextual = true

[tool.mcmr.contextual]
backend = "claude"
model = "claude-sonnet-5"
reasoning_effort = "high"

# Per-rule policy for what the frozen contract or an external framework keeps in place. Each entry
# names the reason the code cannot move, so a new occurrence still has to be argued rather than
# inheriting the exemption.

# `PixiManifest` and `Manifest` mirror the pixi and chefe TOML table layouts one to one, so their
# field count belongs to the file formats and shrinking it would hide a table a user can write.
[tool.mcmr.rules."ALL-CLAS0004"]
exclude = ["src/chefe/compiled/pixi.py", "src/chefe/manifest/schema/root/manifest.py"]

# `Pixi` and `Node` are template-method subtypes of `Tool`, the shape this rule calls `subtype`:
# each sets `name`, overrides a declared hook (`scope`, or `available`/`cwd`), and inherits
# `__call__`, so `Tool.within_cwd` builds their whole argv. `Cargo` was converted to composition
# precisely because it used none of that, which is the line a new occurrence has to argue past.
[tool.mcmr.rules."ALL-CLAS1001"]
exclude = ["src/chefe/backends/pixi/workspace.py", "src/chefe/backends/ecosystems/npm.py"]

# `tomlkit.parse` is the round-trip TOML boundary each editing seam calls directly. Wrapping it
# would create the pass-through ALL-FUNC0005 rejects, so the call stays where a reader expects it.
[tool.mcmr.rules."ALL-DEPE0003"]
ignored_callables = ["tomlkit.parse"]

# The stub is monkeypatched over `pathlib.Path.replace`, so its parameters have to match that
# signature exactly, `(temporary, destination)` included.
[tool.mcmr.rules."ALL-PARA0001"]
exclude = ["tests/activation/test_generated.py"]

# `chefe install --activate-only` and `--resolve` are the published CLI surface. The two flags are
# frozen for users, and folding them into one named behavior would break every existing invocation.
[tool.mcmr.rules."ALL-PARA0004"]
exclude = ["src/chefe/workspace/commands/environment.py"]

# `on_post_build` is the mkdocs hook entry point named by `mkdocs.yml`, so mkdocs reaches it and no
# repository reference can. The same framework contract hands it the whole `MkDocsConfig`.
[tool.mcmr.rules."ALL-PARA0002"]
exclude = ["hooks/llms.py"]

[tool.mcmr.rules."ALL-REAC0001"]
exclude = ["hooks/llms.py"]

# tomlkit hands back plain Python values, so rendering a compiled table has to ask what each value
# is. There is no capability to depend on at that boundary.
[tool.mcmr.rules."PY-INTE0001"]
exclude = ["src/chefe/compiled/pixi.py"]

# GitHub requires a composite action at `.github/actions/<name>/action.yml`, so with today's one
# action, `.github/actions` leads to a single child directory. The layout is fixed by the platform,
# not a navigation step we chose, and it stays a pure pass-through as more actions join `setup`.
[tool.mcmr.rules."ALL-FILE0004"]
exclude = [".github/actions"]

# A test states the same fixture path/module/rule identity per case, and naming it would move the
# fixture away from the assertion that reads it.
[tool.mcmr.rules."ALL-DUPL0005"]
exclude = ["tests"]

[tool.mcmr.providers.datahub]
server = "http://localhost:8080"
report_url = "https://github.com/phvv-me/mcmr"
